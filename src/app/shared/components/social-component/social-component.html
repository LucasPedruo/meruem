<section class="section-social-media">
  <app-custom-button-component
    (buttonClick)="openExternalLink(socialLinks.linkedin)"
    [iconSrc]="'linkedin.svg'"
    iconAlt="Ir a página do Linkedin"
    sizes="small"
    color="link"
  >
  </app-custom-button-component>

  <app-custom-button-component
    (buttonClick)="openExternalLink(socialLinks.instagram)"
    [iconSrc]="'instagram.svg'"
    iconAlt="Ir a pagina do Instagram"
    sizes="small"
    color="link"
  >
  </app-custom-button-component>

  <app-custom-button-component
    (buttonClick)="showConstructionToast()"
    [iconSrc]="'globe.svg'"
    iconAlt="Abrir site completo"
    sizes="small"
    color="link"
  >
  </app-custom-button-component>
</section>
